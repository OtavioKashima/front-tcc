<ion-header class="ion-no-border">
  <ion-toolbar color="primary"
    style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px;">
    <div style="display: flex; align-items: center;">
      <ion-icon name="heart" size="large" style="margin-right: 8px; margin-left: 0.1px;"></ion-icon>
      <ion-title style="margin-left: 4px;">Adoções</ion-title>
    </div>
    <ion-buttons slot="end">
      <ion-button (click)="toggleSearch()">
        <ion-icon slot="icon-only" name="search" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar *ngIf="showSearch">
    <ion-searchbar [(ngModel)]="termoBusca" (ionInput)="filtrar()" placeholder="Buscar adoção..." animated="true">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let adocao of adocoesFiltradas">
        <ion-card class="pet-card" (click)="abrirDetalhe(adocao)">

          <div class="image-container">
            <div class="category-badge">Para Adoção</div>

            <div *ngIf="adocao.fotosArray && adocao.fotosArray.length > 0"
              [class]="'grid-fotos qtd-' + (adocao.fotosArray.length > 4 ? 'mais' : adocao.fotosArray.length)">

              <div class="foto-item" *ngFor="let foto of adocao.fotosArray | slice:0:4; let i = index">
                <img [src]="'http://localhost:3000/uploads/' + foto" [alt]="adocao.titulo">

                <div class="overlay-mais" *ngIf="i === 3 && adocao.fotosArray.length > 4">
                  +{{ adocao.fotosArray.length - 4 }}
                </div>
              </div>
            </div>

            <div *ngIf="!adocao.fotosArray || adocao.fotosArray.length === 0" class="sem-foto">
              <ion-icon name="paw-outline"></ion-icon>
            </div>
          </div>

          <ion-card-header>
            <ion-card-subtitle class="pet-subtitle">
              {{ adocao.idade || 'Idade N/A' }} • {{ adocao.raca || 'SRD' }}
            </ion-card-subtitle>
            <ion-card-title class="pet-title">{{ adocao.titulo }}</ion-card-title>
          </ion-card-header>

          <ion-card-content class="pet-description">
            {{ adocao.descricao }}
          </ion-card-content>

          <div class="card-footer">
            <ion-button fill="clear" size="small">Ver Detalhes</ion-button>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="empty-state" *ngIf="adocoesFiltradas.length === 0">
    <ion-icon name="paw-outline"></ion-icon>
    <p>Nenhum pet para adoção encontrado por aqui...</p>
  </div>
</ion-content>

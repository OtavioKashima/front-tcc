<ion-content [scrollY]="true">

  <!-- Botões flutuantes sobre a imagem -->
  <div class="floating-buttons">
    <button class="float-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline" class="seta-voltar"></ion-icon>
    </button>
    <button class="float-btn" (click)="compartilhar()">
      <ion-icon name="arrow-redo-outline" class="seta-voltar"></ion-icon>
    </button>
  </div>

  <!-- Imagem grande -->
  <div class="hero-image-wrapper">
    <img [src]="denuncia.imagem" [alt]="denuncia.titulo" class="hero-image">
    <div class="hero-overlay">
      <div class="hero-badge hero-badge--denuncia">Denúncia</div>
      <h1 class="hero-title">{{ denuncia.titulo }}</h1>
    </div>
  </div>

  <div class="content-body">

    <!-- Usuário que publicou -->
    <div class="owner-card">
      <img
        [src]="denuncia.usuario.avatar"
        [alt]="denuncia.usuario.nome"
        class="owner-avatar">
      <div class="owner-info">
        <span class="owner-label">Publicado por</span>
        <span class="owner-name">{{ denuncia.usuario.nome }}</span>
        <span class="owner-city">
          <ion-icon name="location-outline"></ion-icon>
          {{ denuncia.usuario.cidade }}
        </span>
      </div>
    </div>

    <!-- Descrição -->
    <div class="section">
      <h2 class="section-title">Descrição da Denúncia</h2>
      <p class="section-text">{{ denuncia.descricao }}</p>
    </div>

    <!-- Chips -->
    <div class="chips-row">
      <div class="chip">
        <ion-icon name="alert-circle-outline"></ion-icon>
        {{ denuncia.tipo }}
      </div>
      <div class="chip">
        <ion-icon name="time-outline"></ion-icon>
        {{ denuncia.dataFormatada }}
      </div>
    </div>

    <!-- Detalhes -->
    <div class="animal-details">
      <div class="detail-card">
        <span class="detail-label">Status</span>
        <span class="detail-value" [ngClass]="getStatusClass()">{{ denuncia.status }}</span>
      </div>
      <div class="detail-card">
        <span class="detail-label">Categoria</span>
        <span class="detail-value">{{ denuncia.categoria }}</span>
      </div>
      <div class="detail-card">
        <span class="detail-label">Local</span>
        <span class="detail-value">{{ denuncia.local }}</span>
      </div>
    </div>

  </div>

</ion-content>

<!-- Botão fixo -->
<div class="bottom-bar">
  <button class="adopt-btn report-btn" (click)="entrarEmContato()">
    <ion-icon name="chatbubble-ellipses-outline"></ion-icon>
    Entrar em Contato
  </button>
</div>

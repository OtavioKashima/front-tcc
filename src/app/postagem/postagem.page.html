<ion-content [fullscreen]="true">

  <div class="floating-buttons">
    <button class="float-btn" (click)="goToHome()">
      <ion-icon name="arrow-back-outline" class="seta-voltar"></ion-icon>
    </button>
  </div>

  <div class="container">

    <div class="intro">
      <div class="logo-circle">
        <ion-icon name="paw" class="logo-icon"></ion-icon>
      </div>
      <h2>Criar Postagem</h2>
      <p>Escolha o tipo de publicação para continuar</p>
    </div>

    <ion-card class="select-card">
      <div class="select-wrapper">
        <div class="icon-box">
          <ion-icon name="paw-outline"></ion-icon>
        </div>

        <ion-select
          placeholder="Selecione o tipo de postagem"
          interface="popover"
          (ionChange)="mudarTipo($event)">

          <ion-select-option value="adocao">
            Adoção
          </ion-select-option>

          <ion-select-option value="denuncia">
            Denúncia
          </ion-select-option>

        </ion-select>
      </div>
    </ion-card>

    <!-- ADOÇÃO -->
    <div *ngIf="tipoSelecionado === 'adocao'" class="campos-dinamicos">

      <div class="campo">
        <label>Raça do animal:</label>

        <ion-input
          class="custom-input"
          placeholder="Ex: Labrador"
          [(ngModel)]="form.raca">
        </ion-input>
      </div>

      <div class="campo">
        <label>Gênero:</label>

        <div class="campo-select">
          <ion-select
            placeholder="Selecione o gênero"
            [(ngModel)]="form.genero">

            <ion-select-option value="macho">
              Macho
            </ion-select-option>

            <ion-select-option value="femea">
              Fêmea
            </ion-select-option>

          </ion-select>
        </div>
      </div>

      <div class="campo">
        <label>Idade do animal:</label>

        <ion-input
          class="custom-input"
          type="number"
          placeholder="Ex: 2 anos"
          [(ngModel)]="form.idade">
        </ion-input>
      </div>

      <div class="campo">
        <label>Foto:</label>

        <div class="foto-box" (click)="selecionarFoto()">

          <ng-container *ngIf="!fotoPreview">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <span>Toque para adicionar foto</span>
          </ng-container>

          <ng-container *ngIf="fotoPreview">
            <img [src]="fotoPreview" class="foto-preview" alt="Preview" />

            <div class="foto-overlay">
              <ion-icon name="create-outline"></ion-icon>
              <span>Trocar foto</span>
            </div>
          </ng-container>

        </div>

        <input
          #fileInput
          type="file"
          accept="image/*"
          style="display:none"
          (change)="onFotoSelecionada($event)" />
      </div>

      <div class="campo">
        <label>Descrição:</label>

        <ion-textarea
          class="custom-textarea"
          placeholder="Descreva o animal..."
          [(ngModel)]="form.descricao">
        </ion-textarea>
      </div>

      <div class="btn-area">
        <button class="adopt-btn" (click)="postar()">
          <ion-icon name="paw"></ion-icon>
          Postar adoção
        </button>
      </div>

    </div>

    <!-- DENÚNCIA -->
    <div *ngIf="tipoSelecionado === 'denuncia'" class="campos-dinamicos">

      <div class="campo">
        <label>Título:</label>

        <ion-input
          class="custom-input"
          placeholder="Ex: Maus tratos na Rua das Flores"
          [(ngModel)]="form.titulo">
        </ion-input>
      </div>

      <div class="campo">
        <label>Descrição da denúncia:</label>

        <ion-textarea
          class="custom-textarea"
          placeholder="Descreva o que está acontecendo..."
          [(ngModel)]="form.descricao">
        </ion-textarea>
      </div>

      <div class="campo">
        <label>Foto:</label>

        <div class="foto-box" (click)="selecionarFotoDenuncia()">

          <ng-container *ngIf="!fotoPreviewDenuncia">
            <ion-icon name="cloud-upload-outline"></ion-icon>
            <span>Toque para adicionar foto</span>
          </ng-container>

          <ng-container *ngIf="fotoPreviewDenuncia">
            <img [src]="fotoPreviewDenuncia" class="foto-preview" alt="Preview" />

            <div class="foto-overlay">
              <ion-icon name="create-outline"></ion-icon>
              <span>Trocar foto</span>
            </div>
          </ng-container>

        </div>

        <input
          #fileInputDenuncia
          type="file"
          accept="image/*"
          style="display:none"
          (change)="onFotoDenunciaSelecionada($event)" />
      </div>

      <div class="campo">
        <label>Localização:</label>

        <ion-input
          class="custom-input"
          placeholder="Ex: Rua das Flores, 123 - Joinville, SC"
          [(ngModel)]="form.localizacao">
        </ion-input>
      </div>

      <div class="btn-area">
        <button class="adopt-btn" (click)="postar()">
          <ion-icon name="paw"></ion-icon>
          Postar denúncia
        </button>
      </div>

    </div>

  </div>

</ion-content>

<ion-header>
  <ion-toolbar class="toolbar-custom">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs"></ion-back-button>
    </ion-buttons>
    <ion-title>Nova Postagem</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <div class="container">

    <div class="intro">
      <h2>Criar Postagem</h2>
      <p *ngIf="isAdminOuOng">Escolha o tipo de publicação para continuar</p>
      <p *ngIf="!isAdminOuOng">Área de publicação de denúncias e relatos</p>
    </div>

    <ion-card class="select-card">
      <div class="select-wrapper">
        <div class="icon-box">
          <ion-icon [name]="tipoSelecionado === 'denuncia' ? 'alert-circle-outline' : 'paw-outline'"></ion-icon>
        </div>

        <ion-select placeholder="Selecione o tipo de postagem" interface="popover" [value]="tipoSelecionado"
          [disabled]="!isAdminOuOng" (ionChange)="mudarTipo($event)">

          <ion-select-option value="denuncia">🚨 Denúncia</ion-select-option>
          <ion-select-option value="adocao" *ngIf="isAdminOuOng">🏠 Adoção (Apenas Admin/ONG)</ion-select-option>
          <ion-select-option value="doacao" *ngIf="isAdminOuOng">🎁 Doação (Apenas Admin/ONG)</ion-select-option>

        </ion-select>
      </div>
    </ion-card>

    <div *ngIf="tipoSelecionado">
      <div class="campo">
        <label>Título da Postagem: <span style="color: red;">*</span></label>
        <ion-input type="text" [(ngModel)]="titulo" name="titulo" placeholder="Digite um título resumido"></ion-input>
      </div>
    </div>

    <div *ngIf="tipoSelecionado === 'adocao' || tipoSelecionado === 'doacao'">

      <div class="campo">
        <label>Raça do animal / Porte:</label>
        <ion-input type="text" [(ngModel)]="raca" name="raca"
          placeholder="Ex: Vira-lata, Poodle, Desconhecida"></ion-input>
      </div>

      <div class="campo">
        <label>Gênero:</label>
        <div class="campo-select" style="margin-top: 5px;">
          <ion-select placeholder="Selecione o gênero" interface="popover" [(ngModel)]="genero" name="genero">
            <ion-select-option value="macho">Macho</ion-select-option>
            <ion-select-option value="femea">Fêmea</ion-select-option>
            <ion-select-option value="dois">Macho e Fêmea (Mais de um)</ion-select-option>
          </ion-select>
        </div>
      </div>

      <div class="campo">
        <label>Idade aproximada (Anos):</label>
        <ion-input type="number" [(ngModel)]="idade" name="idade" placeholder="Ex: 2"></ion-input>
      </div>

    </div>

    <div *ngIf="tipoSelecionado">

      <div class="campo">
        <label>Foto do Pet / Ocorrência:</label>
        <input type="file" accept="image/*" (change)="selecionarFoto($event)" #fileInput style="display: none;" />

        <div class="foto-box" (click)="fileInput.click()">
          <ion-icon *ngIf="!fotoPreview" name="cloud-upload-outline" size="large"></ion-icon>
          <img *ngIf="fotoPreview" [src]="fotoPreview" alt="Foto selecionada" class="preview-img" />
        </div>
      </div>

      <div class="campo">
        <label>Descrição detalhada: <span style="color: red;">*</span></label>
        <ion-textarea [(ngModel)]="descricao" name="descricao"
          [placeholder]="tipoSelecionado === 'denuncia' ? 'Descreva detalhadamente a situação do animal e a localização...' : 'Conte um pouco mais sobre o pet...'">
        </ion-textarea>
      </div>

      <div class="btn-area">
        <ion-button expand="block" class="btn-postar" (click)="enviarPostagem()">Publicar Postagem</ion-button>
      </div>

    </div>

  </div>
</ion-content>

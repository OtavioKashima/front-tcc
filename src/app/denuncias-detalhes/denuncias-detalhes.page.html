<ion-content [scrollY]="true">

  <div class="floating-buttons">
    <button class="float-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline" class="seta-voltar"></ion-icon>
    </button>
    <button class="float-btn" (click)="compartilhar()">
      <ion-icon name="arrow-redo-outline" class="seta-voltar"></ion-icon>
    </button>
  </div>

  <div class="hero-image-wrapper">

    <div class="carousel-container" (scroll)="onScroll($event)">
      <img *ngFor="let img of denuncia.imagens" [src]="img" [alt]="denuncia.titulo" class="hero-image carousel-slide">
    </div>

    <div class="hero-overlay">
      <h1 class="hero-title">{{ denuncia.titulo }}</h1>
    </div>

    <div class="carousel-dots" *ngIf="denuncia.imagens && denuncia.imagens.length > 1">
      <div class="dot" *ngFor="let img of denuncia.imagens; let i = index" [class.active]="i === imagemAtiva">
      </div>
    </div>

  </div>

  <div class="content-body">

    <div class="owner-card" (click)="irParaPerfilOng()">
      <img
        [src]="denuncia.usuario_foto ? ('http://localhost:3000/uploads/' + denuncia.usuario_foto) : 'https://ionicframework.com/docs/img/demos/avatar.svg'"
        (error)="img.src='https://ionicframework.com/docs/img/demos/avatar.svg'" #img alt="Foto do Denunciante"
        class="owner-avatar owner-avatar--ong">

      <div class="owner-info">
        <span class="owner-label">Denunciante</span>
        <span class="owner-name">{{ denuncia.usuario_nome || 'Usuário Desconhecido' }}</span>
      </div>
      <ion-icon name="chevron-forward-outline" class="ong-arrow"></ion-icon>
    </div>

    <div class="section">
      <h2 class="section-title">Sobre o caso</h2>
      <p class="section-text">{{ denuncia.descricaoCompleta || denuncia.descricao }}</p>
    </div>

    <div class="chips-row">
      <div class="chip chip-alert">
        <ion-icon name="alert-circle-outline"></ion-icon>
        Atenção Urgente
      </div>
      <div class="chip">
        <ion-icon name="help-buoy-outline"></ion-icon>
        Precisa de Resgate
      </div>
    </div>

    <div class="animal-details" *ngIf="denuncia.localizacao">
      <div class="detail-card location-card">
        <span class="detail-label">Localização da Ocorrência</span>
        <span class="detail-value">
          <ion-icon name="location-outline"></ion-icon>
          {{ denuncia.localizacao }}
        </span>
      </div>
    </div>

  </div>

</ion-content>

<div class="bottom-bar">
  <button class="action-btn" (click)="oferecerAjuda()">
    <ion-icon name="hand-right-outline"></ion-icon>
    Oferecer Ajuda
  </button>
</div>

<ion-header [translucent]="true">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <button class="toolbar-btn" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
    </ion-buttons>
    <ion-buttons slot="end">
      <button class="toolbar-btn" (click)="editarPerfil()">
        <ion-icon name="create-outline"></ion-icon>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true">

  <!-- HERO -->
  <div class="perfil-hero">
    <div class="hero-bg"></div>
    <div class="perfil-avatar-wrapper">
      <img [src]="usuario.avatar" class="perfil-foto" [alt]="usuario.nome">
    </div>
    <h2 class="perfil-nome">{{ usuario.nome }}</h2>
  </div>

  <!-- HEADER DA SEÇÃO -->
  <div class="secao-header">
    <span class="secao-titulo">
      <ion-icon name="alert-circle-outline"></ion-icon>
      Minhas Denúncias
    </span>
    <span class="secao-count">
      {{ denuncias.length }} denúncia{{ denuncias.length !== 1 ? 's' : '' }}
    </span>
  </div>

  <!-- SEM DENÚNCIAS -->
  <div class="sem-resultados" *ngIf="denuncias.length === 0">
    <ion-icon name="alert-circle-outline" class="sem-resultados-icon"></ion-icon>
    <p>Nenhuma denúncia ainda</p>
    <span class="sem-resultados-sub">Viu algo errado? Reporte aqui.</span>
  </div>

  <!-- FEED -->
  <div class="feed">
    <div
      class="denuncia-card"
      *ngFor="let post of denuncias"
      (click)="abrirDenuncia(post)">

      <div class="denuncia-header">
        <span>{{ post.titulo }}</span>
        <div class="denuncia-acoes">
          <button class="acao-btn" (click)="editarDenuncia(post); $event.stopPropagation()">
            <ion-icon name="create-outline"></ion-icon>
          </button>
          <button class="acao-btn" (click)="excluirDenuncia(post); $event.stopPropagation()">
            <ion-icon name="trash-outline"></ion-icon>
          </button>
        </div>
      </div>

      <div class="denuncia-content">
        <img [src]="post.imagem" [alt]="post.titulo" class="denuncia-image">
        <div class="denuncia-info">
          <p class="denuncia-descricao">{{ post.descricao }}</p>
        </div>
      </div>

    </div>
  </div>

  <div class="bottom-space"></div>
</ion-content>

<ion-header class="ion-no-border">
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Denuncias</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="toggleSearch()">
        <ion-icon slot="icon-only" name="search-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar *ngIf="showSearch">
    <ion-searchbar 
      [(ngModel)]="termoBusca" 
      (ionInput)="filtrar()" 
      placeholder="Buscar pet..." 
      animated="true">
    </ion-searchbar>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let pet of petsFiltrados">
        <ion-card class="pet-card" (click)="abrirDetalhe(pet)">
          <div class="image-container">
            <img [src]="pet.imagem" alt="{{ pet.titulo }}" loading="lazy" />
            <div class="category-badge">Adoção</div>
          </div>

          <ion-card-header>
            <ion-card-title class="pet-title">{{ pet.titulo }}</ion-card-title>
            <ion-card-subtitle class="pet-subtitle">
              <ion-icon name="time-outline"></ion-icon> {{ pet.idade }}
            </ion-card-subtitle>
          </ion-card-header>

          <ion-card-content class="pet-description">
            {{ pet.descricao }}
          </ion-card-content>
          
          <div class="card-footer">
            <ion-button fill="clear" size="small">Ver Detalhes</ion-button>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="empty-state" *ngIf="petsFiltrados.length === 0">
    <ion-icon name="paw-outline"></ion-icon>
    <p>Nenhum pet encontrado por aqui...</p>
  </div>
</ion-content>

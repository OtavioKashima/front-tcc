<ion-header class="ion-no-border">
  <ion-toolbar color="primary"
    style="display: flex; align-items: center; justify-content: space-between; padding: 0 10px;">
    <div style="display: flex; align-items: center;">
      <ion-icon name="warning" size="large" style="margin-right: 8px; margin-left: 0.1px;"></ion-icon>
      <ion-title style="margin-left: 4px;">Denúncias</ion-title>
    </div>
    <ion-buttons slot="end">
      <ion-button (click)="toggleSearch()">
        <ion-icon slot="icon-only" name="search" size="large"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>

  <ion-toolbar *ngIf="showSearch">
    <div class="busca-customizada">
      <ion-input placeholder="Buscar denúncia..." [clearInput]="true" [(ngModel)]="termoBusca" (ionInput)="filtrar()">
      </ion-input>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="4" *ngFor="let denuncia of denunciasFiltradas">
        <ion-card class="pet-card" (click)="irParaDetalhes(denuncia)">

          <div class="image-container">

            <div *ngIf="denuncia.fotosArray && denuncia.fotosArray.length > 0"
              [class]="'grid-fotos qtd-' + (denuncia.fotosArray.length > 4 ? 'mais' : denuncia.fotosArray.length)">

              <div class="foto-item" *ngFor="let foto of denuncia.fotosArray | slice:0:4; let i = index">
                <img [src]="'http://localhost:3000/uploads/' + foto" [alt]="denuncia.titulo">

                <div class="overlay-mais" *ngIf="i === 3 && denuncia.fotosArray.length > 4">
                  +{{ denuncia.fotosArray.length - 4 }}
                </div>
              </div>
            </div>

            <div *ngIf="!denuncia.fotosArray || denuncia.fotosArray.length === 0" class="sem-foto">
              <ion-icon name="camera-outline"></ion-icon>
            </div>
          </div>

          <ion-card-header>
            <ion-card-subtitle class="pet-subtitle" style="display: flex; align-items: center; gap: 4px;">
              <ion-icon name="location-outline"></ion-icon>
              {{ denuncia.localizacao || denuncia.local || 'Localização não informada' }}
            </ion-card-subtitle>
            <ion-card-title class="pet-title">{{ denuncia.titulo }}</ion-card-title>
          </ion-card-header>

          <ion-card-content class="pet-description">
            {{ denuncia.descricao }}
          </ion-card-content>

          <div class="card-footer">
            <ion-button fill="clear" size="small">Ver Detalhes</ion-button>
          </div>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <div class="empty-state" *ngIf="denunciasFiltradas.length === 0">
    <ion-icon name="paw-outline"></ion-icon>
    <p>Nenhuma denúncia encontrada por aqui...</p>
  </div>
</ion-content>

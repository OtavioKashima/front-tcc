<ion-header [translucent]="true">
  <ion-toolbar class="custom-toolbar">

    <div class="header-content">
      <div class="title-section">
        <ion-icon name="alert-circle-outline" size="large" class="header-icon"></ion-icon>
        <span class="header-title">Denuncie</span>
      </div>
      <div class="header-actions">
        <ion-icon
          [name]="showSearch ? 'close-outline' : 'search-outline'"
          class="header-icon"
          (click)="toggleSearch()">
        </ion-icon>
      </div>
    </div>

    <div class="search-bar-wrapper" [class.visible]="showSearch">
      <div class="search-input-wrapper">
        <ion-icon name="search-outline" class="search-input-icon"></ion-icon>
        <input
          class="search-input"
          placeholder="Buscar denúncia..."
          [(ngModel)]="termoBusca"
          (input)="filtrar()">
        <ion-icon
          *ngIf="termoBusca"
          name="close-circle-outline"
          class="search-clear-icon"
          (click)="limparBusca()">
        </ion-icon>
      </div>
    </div>

  </ion-toolbar>
</ion-header>

<ion-content [scrollY]="true">

  <div class="feed">

    <div *ngIf="denunciasFiltradas.length === 0" class="sem-resultados">
      <ion-icon name="alert-circle-outline" class="sem-resultados-icon"></ion-icon>
      <p>Nenhuma denúncia encontrada</p>
      <span class="sem-resultados-sub">Tente ajustar a busca</span>
    </div>

    <div class="denuncia-card" *ngFor="let denuncia of denunciasFiltradas">

      <div class="denuncia-header">
        <span>{{ denuncia.titulo }}</span>
        <div class="denuncia-acoes">
          <button class="acao-btn" (click)="compartilhar(denuncia); $event.stopPropagation()">
            <ion-icon name="arrow-redo-outline"></ion-icon>
          </button>
        </div>
      </div>

      <div class="denuncia-content">
        <img [src]="denuncia.imagem" [alt]="denuncia.titulo" class="denuncia-image">
        <div class="denuncia-info">
          <p class="denuncia-descricao">{{ denuncia.descricao }}</p>
        </div>
      </div>

    </div>

  </div>

</ion-content>

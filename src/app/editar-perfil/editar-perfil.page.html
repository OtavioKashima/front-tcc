<ion-content [scrollY]="true">

  <div class="floating-buttons">
    <button class="float-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline" class="seta-voltar"></ion-icon>
    </button>
  </div>

  <div class="hero-image-wrapper">
    <div class="hero-bg"></div>
    <div class="hero-avatar-area">
      <div class="avatar-wrapper">
        <img [src]="avatarPreview || usuario.avatar" alt="Foto de perfil" class="avatar-img">
        <button class="trocar-foto-btn" (click)="fileInput.click()">
          <ion-icon name="camera-outline"></ion-icon>
        </button>
        <input #fileInput type="file" accept="image/*" style="display:none" (change)="onAvatarSelecionado($event)">
      </div>
      <h1 class="hero-nome">{{ form.nome || usuario.nome || 'Nome de usuário' }}</h1>
      <span class="hero-sub">Editar perfil</span>
    </div>
  </div>

  <div class="content-body">


    <div class="input-group">
      <div class="input-wrapper">
        <ion-icon name="person-outline" class="input-icon"></ion-icon>
        <input
          class="field-input"
          type="text"
          [(ngModel)]="form.nome"
          placeholder="Nome de usuário"
          maxlength="60">
      </div>
    </div>

 
    <div class="input-group">
      <div class="input-wrapper">
        <ion-icon name="call-outline" class="input-icon"></ion-icon>
        <input
          class="field-input"
          type="tel"
          [(ngModel)]="form.telefone"
          placeholder="Telefone"
          (input)="maskTelefone()"
          maxlength="15">
      </div>
    </div>

 
    <div class="input-group">
      <div class="input-wrapper">
        <ion-icon name="mail-outline" class="input-icon"></ion-icon>
        <input
          class="field-input"
          type="email"
          [(ngModel)]="form.email"
          placeholder="Email"
          (input)="validarEmail()">
      </div>
      <div *ngIf="emailInvalido" class="error-message">
        O e-mail deve conter '@' e um domínio válido
      </div>
    </div>

    <div class="input-group">
      <div class="input-wrapper">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <input
          class="field-input"
          [type]="mostrarSenha ? 'text' : 'password'"
          [(ngModel)]="form.senha"
          placeholder="Nova senha">
        <button class="toggle-senha" (click)="mostrarSenha = !mostrarSenha">
          <ion-icon [name]="mostrarSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
    </div>

   
    <div class="input-group">
      <div class="input-wrapper">
        <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
        <input
          class="field-input"
          [type]="mostrarConfirmarSenha ? 'text' : 'password'"
          [(ngModel)]="form.confirmarSenha"
          placeholder="Confirmar nova senha">
        <button class="toggle-senha" (click)="mostrarConfirmarSenha = !mostrarConfirmarSenha">
          <ion-icon [name]="mostrarConfirmarSenha ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </button>
      </div>
      <div *ngIf="senhasNaoCoincidem" class="error-message">
        As senhas não coincidem
      </div>
    </div>

 
    <button class="salvar-btn" (click)="salvar()" [disabled]="salvando || emailInvalido">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      {{ salvando ? 'Salvando...' : 'Salvar Alterações' }}
    </button>

  
    <button class="deletar-btn" (click)="confirmarDeletar()">
      <ion-icon name="trash-outline"></ion-icon>
      Deletar minha conta
    </button>

  </div>

</ion-content>

<ion-content class="ion-padding">

  <div style="text-align: center; margin-top: 20px; margin-bottom: 20px;">
    <img 
      [src]="previewFoto ? previewFoto : 'https://ui-avatars.com/api/?name=' + (usuario.nome || 'U') + '&background=random&color=fff'" 
      style="width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #3880ff;"
      alt="Foto de Perfil" 
    />
  </div>

  <ion-list lines="none">
    
    <ion-item class="custom-input">
      <ion-icon name="camera-outline" slot="start" color="medium"></ion-icon>
      <div style="width: 100%; padding-top: 10px; padding-bottom: 10px;">
        <ion-label position="stacked" style="margin-bottom: 8px; color: #666;">Escolher nova foto</ion-label>
        <input type="file" (change)="selecionarFoto($event)" accept="image/*" />
      </div>
    </ion-item>

    <ion-item class="custom-input">
      <ion-icon name="person-outline" slot="start" color="medium"></ion-icon>
      <ion-input 
        label="Nome Completo" 
        labelPlacement="stacked" 
        [(ngModel)]="usuario.nome" 
        placeholder="Digite seu nome">
      </ion-input>
    </ion-item>

    <ion-item class="custom-input">
      <ion-icon name="call-outline" slot="start" color="medium"></ion-icon>
      <ion-input 
        type="tel" 
        label="Telefone" 
        labelPlacement="stacked" 
        [(ngModel)]="usuario.telefone" 
        placeholder="Ex: 14 99999-9999">
      </ion-input>
    </ion-item>

  </ion-list>

  <ion-button expand="block" shape="round" color="primary" style="margin-top: 30px;" (click)="salvarPerfil()">
    Salvar Alterações
  </ion-button>

</ion-content>

<ion-header class="ion-no-border">
  <ion-toolbar class="custom-toolbar">
    <ion-buttons slot="start">
      <ion-button disabled="true" class="header-icon-btn">
        <ion-icon name="paw" class="header-icon"></ion-icon> 
        </ion-button>
    </ion-buttons>
    
    <ion-title>Início</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" color="light">

  <h2 class="sessao-titulo">Comunicados</h2>

  <div class="comunicados-scroll">
    <div class="comunicado-card" *ngFor="let aviso of comunicados" (click)="abrirComunicado(aviso)"
      style="cursor: pointer;">
      <div class="comunicado-header">
        <ion-icon name="megaphone-outline"></ion-icon>
        <span>{{ aviso.data_criacao | date:'dd/MM/yyyy' }}</span>
      </div>
      <h3>{{ aviso.titulo }}</h3>
      <p>{{ aviso.texto }}</p>
    </div>
  </div>

  <div class="divider"></div>

  <h2 class="sessao-titulo">Apoie uma ONG</h2>
  <p class="sessao-sub">Selecione uma ONG para doar via PIX</p>

  <div class="donation-card" *ngFor="let ong of ongs" (click)="abrirDoacao(ong)">
    <div class="donation-content">
      <img [src]="getFotoUrl(ong.foto_perfil)" [alt]="ong.nome" class="donation-image">
      <div class="donation-info">
        <strong>{{ ong.nome }}</strong>
        <p class="cidade-txt"><ion-icon name="location-outline"></ion-icon> {{ ong.cidade || 'Local não informado' }} -
          {{ ong.estado }}</p>
        <p class="bio-txt">{{ ong.bio || 'Ajude a nossa causa com qualquer valor!' }}</p>
      </div>
    </div>
  </div>

</ion-content>
